services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: nodejs2025-service_db_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    networks:
      - home-library-net
    restart: always
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - postgres_logs_dev:/dbLogs
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}']
      interval: 5s
      timeout: 2s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.app.dev
    container_name: nodejs2025-service_app_dev
    env_file:
      - .env.dev
    ports:
      - '${PORT}:${PORT}'
    networks:
      - home-library-net
    restart: on-failure
    volumes:
      - ./src:/usr/src/app/src
      - ./logs:/usr/src/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ['sh', '-c', 'npm run start:dev']

volumes:
  postgres_data_dev:
  postgres_logs_dev:

networks:
  home-library-net:
    driver: bridge